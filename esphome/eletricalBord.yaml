substitutions:
  slug: eletrical_bord
  description: "Control of Water Pump Manual, Gate and DoorBell!"
  wifi_static_ip: 192.168.1.104

  wifi_enabled_VPN: 0
  interfaces_enabled_api: 1
  interfaces_enabled_mqtt: 0
packages:
  board: !include boards/wemos_d1_mini.yaml
  <<: !include_dir_named packages/common

output:
  - platform: gpio
    pin:
      number: D4
      inverted: true
    id: built_in_led

light:
  - platform: binary
    id: built_in_status_light
    output: built_in_led
    internal: true

    effects:
      - strobe:
          name: "Pump Auto Flash"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 500ms

text_sensor:
  # -------- Existing HomeAssistant Sensors --------
  - platform: homeassistant
    entity_id: select.water_pump_mode
    id: water_pump_mode
    on_value:
      then:
        - lambda: |-
            id(last_ha_update) = millis();

binary_sensor:
  # -------- Existing HomeAssistant Sensors --------
  - platform: homeassistant
    entity_id: binary_sensor.water_pump_active
    id: water_pump_active
    on_state:
      then:
        - lambda: |-
            id(last_ha_update) = millis();

  # -------- NEW: Water Pump Physical Switch --------
  - platform: gpio
    pin:
      number: D5
      mode: INPUT_PULLUP
    name: "Water Pump Switch Man"
    id: water_pump_switch_man

interval:
  - interval: 1s
    then:
      - if:
          condition:
            wifi.connected:
          then:

            # MANUAL → solid ON only when pump is running
            - if:
                condition:
                  and:
                    - text_sensor.state:
                        id: water_pump_mode
                        state: "Manual"
                    - binary_sensor.is_on: water_pump_active
                then:
                  - light.turn_on:
                      id: built_in_status_light
                      effect: none
                else:
                  - light.turn_off: built_in_status_light

            # AUTO → flash only when pump is running
            - if:
                condition:
                  and:
                    - text_sensor.state:
                        id: water_pump_mode
                        state: "Auto"
                    - binary_sensor.is_on: water_pump_active
                then:
                  - light.turn_on:
                      id: built_in_status_light
                      effect: "Pump Auto Flash"
                else:
                  - light.turn_off: built_in_status_light

          else:
            - light.turn_off: built_in_status_light


switch:
  # -------- Gate Relay (momentary) --------
  - platform: gpio
    pin: D8
    id: gate_relay
    name: "Gate"
    icon: "mdi:gate"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: gate_relay

  # -------- DoorBell Relay (normal) --------
  - platform: gpio
    pin: D2
    id: doorbell_relay
    name: "DoorBell"
    icon: "mdi:bell"
    restore_mode: RESTORE_DEFAULT_OFF
